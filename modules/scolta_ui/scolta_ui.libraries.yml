# The search JS/CSS (and the WASM pair the block wires up via drupalSettings)
# are NOT part of this module's codebase. They are canonical in
# tag1/scolta-php's assets/ directory, which lives under vendor/ and is not
# web-accessible, so AssetDeployer copies them to public://scolta-assets at
# install time and on every cache rebuild.
#
# The stream-wrapper URIs below are declarations of where the bundle lives,
# not the paths handed to the asset system: scolta_library_info_alter()
# resolves each one to a DRUPAL_ROOT-relative path before the library is
# built. They must not be left unresolved. A colon in a JS path is fatal on
# a site with the locale module enabled — _locale_parse_js_file() throws on
# any path containing one, and locale scans every file asset on the page —
# so declaring these URIs directly returned HTTP 500 on every rendered page.
# The css/js cache-busting query string is refreshed by the same cache
# rebuild that refreshes the files.
search:
  version: VERSION
  js:
    public://scolta-assets/js/scolta.js: { minified: false }
  css:
    theme:
      public://scolta-assets/css/scolta.css: {}

drupal_bridge:
  version: VERSION
  js:
    js/scolta-drupal-bridge.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - scolta/search
