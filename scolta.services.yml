services:
  logger.channel.scolta:
    parent: logger.channel_base
    arguments: ['scolta']

  scolta.amazee_config_storage:
    class: Drupal\scolta\AiProvider\Amazee\DrupalConfigStorage
    arguments: ['@state']

  scolta.amazee_budget_handler:
    class: Drupal\scolta\AiProvider\Amazee\BudgetExceededHandler
    arguments: ['@messenger', '@state']

  scolta.ai_service:
    class: Drupal\scolta\Service\ScoltaAiService
    arguments: ['@http_client', '@config.factory', '@logger.channel.scolta', '@scolta.amazee_budget_handler', '@scolta.amazee_config_storage', '@?ai.provider', '@cache.default']

  scolta.pagefind_exporter:
    class: Drupal\scolta\Service\PagefindExporter
    arguments: ['@entity_type.manager', '@renderer', '@file_system', '@logger.channel.scolta']

  scolta.pagefind_builder:
    class: Drupal\scolta\Service\PagefindBuilder
    arguments: ['@logger.channel.scolta', '@file_system', '@scolta.index_locator']

  scolta.content_gatherer:
    class: Drupal\scolta\Service\ScoltaContentGatherer
    arguments: ['@entity_type.manager', '@database', '@module_handler', '@config.factory']

  scolta.index_locator:
    class: Drupal\scolta\Service\IndexLocator

  # Decorate this to narrow who reaches the AI features. Both the block that
  # advertises them and the routes that serve them ask it.
  scolta.ai_access:
    class: Drupal\scolta\Access\AiAccess

  scolta.ai_feature_access_check:
    class: Drupal\scolta\Access\AiFeatureAccessCheck
    arguments: ['@scolta.ai_access']
    tags:
      - { name: access_check, applies_to: _scolta_ai }
