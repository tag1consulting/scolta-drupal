name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  lock-guard:
    name: Verify scolta-php lock source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scolta-php is stable and from Packagist
        run: |
          python3 - <<'PY'
          import json,sys,re
          lock=json.load(open("composer.lock"))
          pkgs=lock.get("packages",[])+lock.get("packages-dev",[])
          p=next((x for x in pkgs if x["name"]=="tag1/scolta-php"),None)
          if not p: sys.exit("scolta-php not in lock")
          dist=(p.get("dist") or {}).get("type")
          ver=p.get("version","")
          bad=[]
          if dist=="path": bad.append(f"dist.type=path ({(p.get('dist') or {}).get('url')})")
          if not re.fullmatch(r"\d+\.\d+\.\d+", ver): bad.append(f"non-stable version {ver}")
          if bad: sys.exit("LOCK GUARD FAILED for tag1/scolta-php: "+"; ".join(bad))
          print(f"Lock guard OK: tag1/scolta-php {ver} via {dist}")
          PY

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: lock-guard
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - name: Install dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGE=$(mktemp -d)
          PKG="scolta-drupal"

          # Root files — enumerated allowlist
          for f in composer.json composer.lock LICENSE README.md scolta.info.yml \
                   scolta.module scolta.install scolta.links.menu.yml \
                   scolta.links.task.yml scolta.permissions.yml \
                   scolta.routing.yml scolta.services.yml scolta.libraries.yml \
                   scolta.api.php; do
            [ -f "$f" ] && cp "$f" "$STAGE/"
          done

          # Source dirs by extension
          for dir in src config css js templates; do
            if [ -d "$dir" ]; then
              find "$dir" \( -name '*.php' -o -name '*.yml' -o -name '*.yaml' \
                -o -name '*.twig' -o -name '*.js' -o -name '*.css' -o -name '*.wasm' \) \
                | while read -r f; do
                  mkdir -p "$STAGE/$(dirname "$f")"
                  cp "$f" "$STAGE/$f"
                done
            fi
          done

          # vendor/ — full tree minus dev cruft
          cp -a vendor "$STAGE/vendor"
          find "$STAGE/vendor" -type d \( -name tests -o -name test \) -exec rm -rf {} + 2>/dev/null || true
          find "$STAGE/vendor" \( \
            -name 'phpunit.xml*' -o -name '*.neon' -o -name '.php-cs-fixer*' \
            -o -name '*.sha256' -o -name '*.toml' -o -name '*.dist' -o -name '*.log' \
          \) -delete 2>/dev/null || true

          cd "$(dirname "$STAGE")"
          mv "$STAGE" "$PKG"
          zip -r "$OLDPWD/$PKG-${VERSION}.zip" "$PKG/"

      - name: Extract CHANGELOG entry
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release-notes.txt
          cat release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: scolta-drupal-*.zip
          fail_on_unmatched_files: true

  validate-zip:
    name: Validate release archive
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download release asset
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in 1 2 3 4 5; do
            gh release download "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --pattern "scolta-drupal-${VERSION}.zip" \
              --output scolta-drupal.zip && break
            echo "Retry $i/5..."
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate archive structure
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          unzip -l scolta-drupal.zip > zip-contents.txt
          cat zip-contents.txt

          if ! grep -qE '^[[:space:]]+[0-9].*scolta-drupal/$' zip-contents.txt; then
            echo "ERROR: Top-level directory is not scolta-drupal/"
            exit 1
          fi

          if ! grep -q 'scolta-drupal/vendor/autoload.php' zip-contents.txt; then
            echo "ERROR: vendor/autoload.php is missing from archive"
            exit 1
          fi

          if ! grep -q 'scolta-drupal/scolta.module' zip-contents.txt; then
            echo "ERROR: scolta.module is missing from archive"
            exit 1
          fi

          # No tests/ or test/ content in vendor directories
          if grep -qE 'scolta-drupal/vendor/.+/tests/' zip-contents.txt; then
            echo "ERROR: Archive contains vendor tests/ content (must be excluded):"
            grep -E 'scolta-drupal/vendor/.+/tests/' zip-contents.txt
            exit 1
          fi
          if grep -qE 'scolta-drupal/vendor/.+/test/' zip-contents.txt; then
            echo "ERROR: Archive contains vendor test/ content (must be excluded):"
            grep -E 'scolta-drupal/vendor/.+/test/' zip-contents.txt
            exit 1
          fi

          # Disallowed extensions
          FAIL=0
          for ext in '.sha256' '.toml' '.dist' '.neon'; do
            if grep -qE "\\${ext}$" zip-contents.txt; then
              echo "ERROR: Archive contains ${ext} files:"
              grep -E "\\${ext}$" zip-contents.txt
              FAIL=1
            fi
          done
          if grep -qE 'phpunit\.xml' zip-contents.txt; then
            echo "ERROR: Archive contains phpunit.xml files:"
            grep -E 'phpunit\.xml' zip-contents.txt
            FAIL=1
          fi
          if grep -q '\.log$' zip-contents.txt; then
            echo "ERROR: Archive contains .log files:"
            grep '\.log$' zip-contents.txt
            FAIL=1
          fi
          [ $FAIL -eq 1 ] && exit 1

          echo "Archive structure OK."
