name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Composer resolves the tag1consulting/scolta-php VCS repo and every packagist
# dist through api.github.com. Unauthenticated that is 60 req/hour/IP, and when
# it runs dry composer cannot prompt under no-interaction and dies with
# "Could not authenticate against github.com" (AuthHelper.php:152, exit 100).
# The run's own token raises it to 1,000 req/hour/repo. Read-only is enough:
# scolta-php is public, so GITHUB_TOKEN can read it even though the token is
# scoped to this repository.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  test:
    name: test-${{ matrix.cell }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Highest+lowest bracketing: lowest = minimum supported PHP with
          # --prefer-lowest (proves the composer.json floors are real, not
          # fiction); highest = newest supported PHP with the newest
          # resolution. Static analysis (phpcs here, the phpstan job below)
          # runs only in the highest cell: one canonical analysis
          # environment. Analysing against older resolutions just produces
          # version-skew findings to chase.
          - cell: lowest
            php: '8.3'
            composer-flags: '--prefer-lowest --prefer-stable'
            lint: false
          - cell: highest
            php: '8.4'
            composer-flags: ''
            lint: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      # The path repo is swapped for the public VCS one, and the constraint in
      # composer.json is deliberately left alone. It used to be overwritten with
      # dev-main@dev here, which meant this job never once resolved the
      # constraint this package ships: composer.json required tag1/scolta-php as
      # ^1.1.0 while src/AiProvider/Amazee/DrupalConfigStorage.php declared
      # `implements ProvenanceAwareConfigStorageInterface`, a class 1.1.0 does
      # not have, and every job in this file quietly replaced the constraint
      # before asking composer anything. A guard that edits the thing it is
      # guarding is not a guard. The shipped ^1.2@dev reaches the development
      # branch on its own, so there is nothing left to overwrite.
      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php ${{ matrix.composer-flags }}

      - name: Lint (Drupal coding standards)
        if: matrix.lint
        run: ./vendor/bin/phpcs

      - name: Run tests
        run: composer test

  # Informational coverage, never a merge gate. The test suites pin scolta-php
  # to dev-main, which is correct — an adapter must not merge ahead of its
  # upstream — but it also means this repo's own suite never exercises an
  # unmerged upstream change before merge.
  #
  # Commit a git ref into .github/upstream-preview to run the suite against it.
  # A committed file rather than a branch-name convention: it is visible in the
  # diff, a reviewer can see exactly what combination was tested, and nothing
  # depends on two repositories happening to use the same branch name. The file
  # being absent (or naming main, where this would just repeat `test`) skips
  # the job, so a forgotten one is harmless.
  #
  # What keeps a red preview out of the merge decision is the branch's
  # required-checks list, which this job is deliberately not on. It also carried
  # a continue-on-error flag, which was redundant against that list and made the
  # job's failure invisible on the pull request instead of merely non-blocking —
  # the opposite of what an informational job is for. That flag additionally
  # tripped the cross-package guard forbidding a muted CI failure anywhere in
  # Scolta, and an exemption for one job would have blunted the guard for every
  # other. (That guard greps this file as text and does not skip comments, so do
  # not spell the flag out in prose here — it will be reported as a violation.)
  upstream-preview:
    name: upstream preview (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the requested upstream ref
        id: ref
        run: |
          if [ ! -f .github/upstream-preview ]; then
            echo "No .github/upstream-preview file; nothing to preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(grep -vE '^\s*(#|$)' .github/upstream-preview | head -1 | tr -d '[:space:]')
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            echo "Upstream preview ref is '${REF:-empty}'; that is what the required jobs already test."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previewing against scolta-php ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.ref.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Point composer at the requested scolta-php ref
        if: steps.ref.outputs.run == 'true'
        env:
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: |
          php -r '
            $ref = getenv("UPSTREAM_REF");
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-" . $ref . "@dev";
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        if: steps.ref.outputs.run == 'true'
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run tests against the previewed upstream
        if: steps.ref.outputs.run == 'true'
        run: composer test

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Highest PHP, matching the lint cell above: static analysis runs
          # against one canonical (newest) environment only.
          php-version: '8.4'
          extensions: intl
          coverage: none
      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Do NOT provide drupal/core here — PHPStan needs the actual source
            // files to analyze against. Unlike the test job, we let core install.
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '
      - run: composer update --no-interaction --prefer-dist --ignore-platform-req=php
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: xdebug

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tail -20

  # Functional (BrowserTestBase) tests inside the same DDEV environment
  # contributors use locally: github-action-setup-ddev starts the committed
  # .ddev config, then `ddev poser` builds the Drupal project around the
  # module exactly as it does on a laptop, so "works in ddev, fails in CI"
  # stops being a category. This replaced a job that hand-built a throwaway
  # Drupal at /tmp with SQLite and `php -S`; tests now run against the
  # addon's mariadb + nginx, which is what the module actually ships on.
  #
  # Both repos are checked out INSIDE the workspace: actions/checkout cannot
  # write outside $GITHUB_WORKSPACE, and .ddev/docker-compose.scolta-php.yaml
  # bind-mounts ../../scolta-php (a sibling of the project root) so the
  # composer.json path repository resolves in the web container — the same
  # sibling-checkout layout used locally. Same resolution semantics as
  # before: the path repo supplies scolta-php main.
  #
  # Two cells bracket the support surface, mirroring test-lowest/test-highest
  # above: integration-lowest is the minimum supported PHP on the minimum
  # supported core with every dependency at its floor; integration-highest
  # is the newest of everything. Stable version-free names, because branch
  # protection matches required checks by literal job name. To reproduce a
  # cell locally: `ddev config --php-version=X`, `ddev core-version Y`, then
  # `ddev poser [flags]` — the same commands this job runs.
  integration:
    name: integration-${{ matrix.cell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: lowest
            php: '8.3'
            drupal-core: '~10.3.0'
            composer-flags: '--prefer-lowest --prefer-stable'
          - cell: highest
            php: '8.4'
            drupal-core: ''
            composer-flags: ''
    defaults:
      run:
        working-directory: scolta-drupal
    steps:
      - uses: actions/checkout@v4
        with:
          path: scolta-drupal

      - name: Checkout scolta-php as the sibling the path repo expects
        uses: actions/checkout@v4
        with:
          repository: tag1consulting/scolta-php
          ref: main
          path: scolta-php

      # autostart false: the cell's PHP version and core floor must be
      # configured before the containers first come up.
      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: scolta-drupal
          autostart: false

      - name: Configure the cell (PHP version, core floor)
        run: |
          ddev config --php-version='${{ matrix.php }}'
          if [ -n '${{ matrix.drupal-core }}' ]; then
            ddev dotenv set .ddev/.env.web --drupal-core '${{ matrix.drupal-core }}'
          fi

      - name: Start DDEV
        run: ddev start

      # Same rate-limit fix as the workflow-level COMPOSER_AUTH above, but
      # composer runs inside the web container, which does not inherit the
      # runner's environment.
      - name: Authenticate composer against api.github.com in the container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ddev exec composer config -g github-oauth.github.com "$GH_TOKEN"

      # This is a throwaway test project, not a shipped artifact. Composer
      # 2.9+ excludes advisory-flagged releases from the solver, and every
      # Drupal 10.3.x has published SAs, so the lowest cell can resolve
      # nothing without this. The real audit gate belongs on the shipped
      # module, not on this scratch site. (The old hand-built functional job
      # carried the same setting under its previous name,
      # audit.block-insecure.)
      - name: Allow advisory-flagged releases in this scratch project
        run: ddev exec composer config -g policy.advisories.block false

      - name: Build the Drupal project around the module
        run: ddev poser ${{ matrix.composer-flags }}

      # No silent resolutions: what this cell actually tested, in the log.
      - name: Report resolved versions
        run: |
          for p in drupal/core drupal/search_api drush/drush phpunit/phpunit tag1/scolta-php; do
            echo "$p: $(ddev exec composer show "$p" 2>/dev/null | awk '/^versions/ {print $NF}')"
          done

      - name: Symlink the module into the docroot
        run: ddev symlink-project

      # Same command a contributor runs locally. phpunit.xml declares the
      # suites; tests/bootstrap.php picks core's test bootstrap because the
      # poser-built docroot is present.
      - name: Run kernel and functional tests
        run: ddev phpunit --testsuite kernel,functional --display-deprecations --testdox

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      # The layout specs read css/scolta.css from the vendored scolta-php —
      # the canonical bundle AssetDeployer serves at runtime — so composer
      # must have installed it before Playwright runs.
      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install
        working-directory: tests/playwright

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/playwright

      - name: Run Playwright layout tests
        run: npx playwright test
        working-directory: tests/playwright

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Hard failure, deliberately outside the `|| echo` below. A declared
      # "version" overrides the version Composer derives from the branch or
      # tag; the drupal.org facade honours it, so the package presented itself
      # as a fixed string whatever branch it came from and a site tracking
      # dev-1.0.x could `composer update` but never `composer install`.
      - name: composer.json must not declare a version
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            if (array_key_exists("version", $j)) {
              fwrite(STDERR, "FAIL: composer.json declares \"version\": " . $j["version"] . "\n");
              fwrite(STDERR, "Remove it. scolta.info.yml is the source of the module version;\n");
              fwrite(STDERR, "extra.branch-alias describes the dev-main mapping.\n");
              exit(1);
            }
            echo "PASS: composer.json declares no version key.\n";
          '

      # Release readiness. Advisory on a development branch, where the version
      # legitimately ends in -dev; the assertion that must never be waved
      # through is the separate step above.
      - name: Check version locations match
        run: |
          php scripts/validate-release.php || echo "Note: -dev versions expected in development"

  # This module is a library, not a deployed application: no composer.lock is
  # committed here (drupal.org ships the git tarball, consumers resolve against
  # their own site's lock, and every job in this file resolves with
  # `composer update`). What is left to check on a branch is the manifest
  # itself.
  manifest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: composer.json must be valid
        run: composer validate --no-check-all --no-check-publish

  dist-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate drupal.org distribution tarball
        run: scripts/validate-dist-archive.sh

  antipatterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for known bad patterns
        run: |
          FAIL=0

          # IndexBuildOrchestrator::build() must be called with a logger argument.
          # (Logger/progress go to build()/finalize(), not the constructor.)
          if grep -rn 'orchestrator->build(' src/ 2>/dev/null | grep -qvE 'logger|Logger'; then
            echo "FAIL: orchestrator->build() called without a logger argument"
            grep -rn 'orchestrator->build(' src/ | grep -vE 'logger|Logger'
            FAIL=1
          fi

          [ $FAIL -eq 0 ] && echo "PASS: No known bad patterns found."
          exit $FAIL

  coherence:
    name: Version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What this catches that the other version jobs do not.
      #
      # scolta-php#275 moved composer.json "version" to 1.2.0-dev and left
      # extra.branch-alias.dev-main on 1.1.x-dev, so for one commit the file
      # said two different things about which line it was. Nothing stopped it:
      # the retired check-version-sync.php compared only MAJOR numbers, which
      # were equal on both sides of that break, and it was wired into no
      # workflow anywhere. The version-sync job that once ran here compared
      # majors too, and has since been removed. This compares the development
      # LINE, which is where the break was.
      #
      # It cost four demos their installs: they pinned the alias line directly
      # as 1.1.x-dev, and once the alias moved to 1.2 there was nothing left to
      # resolve it.
      #
      # No setup-node step and no install: GitHub runners ship node, and
      # scripts/check-coherence.mjs is a dependency-free bundle. It is
      # generated from TypeScript in scolta-fleet and vendored here because
      # that repository is private and this one is public, so checking it out
      # would mean storing a personal access token as a secret here. Edit the
      # source there and run `npm run vendor:coherence` to regenerate.
      - name: This package must state one development line about itself
        run: node scripts/check-coherence.mjs .
