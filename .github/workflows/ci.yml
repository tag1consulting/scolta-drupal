name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Composer resolves the tag1consulting/scolta-php VCS repo and every packagist
# dist through api.github.com. Unauthenticated that is 60 req/hour/IP, and when
# it runs dry composer cannot prompt under no-interaction and dies with
# "Could not authenticate against github.com" (AuthHelper.php:152, exit 100).
# The run's own token raises it to 1,000 req/hour/repo. Read-only is enough:
# scolta-php is public, so GITHUB_TOKEN can read it even though the token is
# scoped to this repository.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            lint: false
          - php: '8.3'
            lint: true
          - php: '8.4'
            lint: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Lint (Drupal coding standards)
        if: matrix.lint
        run: ./vendor/bin/phpcs

      - name: Run tests
        run: composer test

  # The committed browser assets are duplicated from scolta-php on purpose: a
  # site installing drupal/scolta gets the drupal.org tarball built from git,
  # and Composer does not run a dependency's scripts, so nothing copies
  # anything at install time. The committed file IS the shipped file, and this
  # job is the only thing standing between a stale copy and a release.
  #
  # It lives in one job deliberately. It used to be a step inside `test`, after
  # a `composer update` that fired post-update-cmd -> copy-assets, so it
  # compared a file Composer had just written against the source it wrote it
  # from and could not fail on a stale committed copy. The hook is gone (see
  # CHANGELOG); this is the check that replaces it.
  assets-in-sync:
    name: assets-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Compare committed assets against the vendored canonical
        run: |
          set -euo pipefail
          CANONICAL=vendor/tag1/scolta-php/assets
          fail=0

          # Byte comparison, not checksums: it needs no manifest, it cannot be
          # subtly wrong, and it works against every scolta-php version. The
          # only mapping kept is where the two layouts genuinely differ
          # (scolta-php assets/wasm/ -> this module's js/wasm/).
          compare() {
            src="$CANONICAL/$1"
            dest="$2"
            if [ ! -f "$src" ]; then
              echo "ERROR: canonical source $src is missing from the vendored scolta-php."
              fail=1
              return
            fi
            if [ ! -f "$dest" ]; then
              echo "ERROR: committed asset $dest is missing."
              fail=1
              return
            fi
            if cmp -s "$src" "$dest"; then
              echo "OK:       $dest is byte-identical to scolta-php assets/$1"
            else
              echo "MISMATCH: $dest differs from scolta-php assets/$1"
              fail=1
            fi
          }

          compare js/scolta.js             js/scolta.js
          compare css/scolta.css           css/scolta.css
          compare wasm/scolta_core.js      js/wasm/scolta_core.js
          compare wasm/scolta_core_bg.wasm js/wasm/scolta_core_bg.wasm

          if [ "$fail" -ne 0 ]; then
            cat >&2 <<'MSG'

          ------------------------------------------------------------------
          The committed browser assets do not match scolta-php.

          This job resolves tag1/scolta-php from dev-main, so it compares what
          this branch would ship against the current tip of scolta-php main.
          Two things cause a mismatch, and the second is the common one:

            1. A STALE COMMITTED COPY. A re-vendor was forgotten or partial.
               Fix it here: run `composer copy-assets`, then commit the result.

            2. A COORDINATED CHANGE WHOSE UPSTREAM HAS NOT MERGED YET. The
               bundle on this branch is newer than scolta-php main, because
               the matching scolta-php pull request is still open. Nothing is
               wrong with this branch. Merge scolta-php first; this job goes
               green once main carries the same bundle.

               Do NOT run `composer copy-assets` to silence this case. That
               overwrites the new bundle with the old one and is exactly the
               failure this check exists to catch.
          ------------------------------------------------------------------
          MSG
            exit 1
          fi
          echo "All committed assets are byte-identical to the vendored scolta-php."

  # Informational coverage, never a merge gate. `assets-in-sync` and the test
  # suites pin scolta-php to dev-main, which is correct — an adapter must not
  # merge ahead of its upstream — but it also means this repo's own suite never
  # exercises an unmerged upstream change before merge.
  #
  # Commit a git ref into .github/upstream-preview to run the suite against it.
  # A committed file rather than a branch-name convention: it is visible in the
  # diff, a reviewer can see exactly what combination was tested, and nothing
  # depends on two repositories happening to use the same branch name. The file
  # being absent (or naming main, where this would just repeat `test`) skips
  # the job, so a forgotten one is harmless. continue-on-error keeps a red
  # preview out of the merge decision.
  upstream-preview:
    name: upstream preview (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the requested upstream ref
        id: ref
        run: |
          if [ ! -f .github/upstream-preview ]; then
            echo "No .github/upstream-preview file; nothing to preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(grep -vE '^\s*(#|$)' .github/upstream-preview | head -1 | tr -d '[:space:]')
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            echo "Upstream preview ref is '${REF:-empty}'; that is what the required jobs already test."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previewing against scolta-php ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.ref.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Point composer at the requested scolta-php ref
        if: steps.ref.outputs.run == 'true'
        env:
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: |
          php -r '
            $ref = getenv("UPSTREAM_REF");
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-" . $ref . "@dev";
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        if: steps.ref.outputs.run == 'true'
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run tests against the previewed upstream
        if: steps.ref.outputs.run == 'true'
        run: composer test

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Do NOT provide drupal/core here — PHPStan needs the actual source
            // files to analyze against. Unlike the test job, we let core install.
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '
      - run: composer update --no-interaction --prefer-dist --ignore-platform-req=php
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: xdebug

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tail -20

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated when code changes
        run: |
          CODE_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'src/' 'composer.json' 'tests/' 'config/' 'js/' 'css/' '*.module' '*.install' | head -1)
          if [ -n "$CODE_CHANGED" ]; then
            CHANGELOG_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md)
            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "FAIL: Code changed but CHANGELOG.md was not updated."
              echo "Please add an entry under ## [Unreleased] in CHANGELOG.md."
              exit 1
            fi
            echo "PASS: CHANGELOG.md updated alongside code changes."
          else
            echo "SKIP: No code changes detected."
          fi

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout scolta-php
        uses: actions/checkout@v4
        with:
          repository: tag1consulting/scolta-php
          path: scolta-php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Strip path-repo entry from scolta-drupal composer.json
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [];
            $j["require"]["tag1/scolta-php"] = "@dev";
            $j["minimum-stability"] = "dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Create Drupal 11 project (drupal/drupal includes dev deps + Mink)
        run: |
          composer create-project drupal/drupal:11.3.10 /tmp/drupal \
            --no-interaction --no-install --quiet

      - name: Configure Drupal project to use this module as a path repo
        working-directory: /tmp/drupal
        run: |
          composer config repositories.scolta-drupal path "$GITHUB_WORKSPACE"
          composer config repositories.scolta-php path "$GITHUB_WORKSPACE/scolta-php"
          # This /tmp/drupal site is a disposable functional-test harness, not a
          # shipped artifact. Composer 2.9 excludes advisory-flagged packages from
          # the solver pool ("block-insecure"), so the pinned drupal/core 11.3.10
          # stopped resolving the moment new SA-CORE advisories were published —
          # breaking every PR with no code change. Disable install-time advisory
          # blocking for this throwaway install so the smoke test stays green
          # regardless of the latest core advisory churn (the real audit gate
          # belongs on the shipped module, not on this scratch site).
          composer config audit.block-insecure false

      - name: Install Drupal + scolta + drush
        working-directory: /tmp/drupal
        run: |
          composer require \
            tag1/scolta-drupal:@dev \
            drupal/search_api:^1 \
            drush/drush:^13 \
            --no-interaction --ignore-platform-req=php

      - name: Ensure module is in the contrib modules path
        working-directory: /tmp/drupal
        run: |
          mkdir -p modules/contrib
          if [ ! -e modules/contrib/scolta ]; then
            ln -sf "$GITHUB_WORKSPACE" modules/contrib/scolta
          fi

      - name: Install Drupal site with SQLite
        working-directory: /tmp/drupal
        run: |
          mkdir -p sites/default/files
          chmod 777 sites/default/files
          ./vendor/bin/drush site:install minimal \
            --db-url="sqlite://localhost/$(pwd)/sites/default/files/test.sqlite" \
            --yes --quiet

      - name: Start PHP built-in web server
        working-directory: /tmp/drupal
        run: |
          php -S localhost:8080 -t . > /tmp/php-server.log 2>&1 &
          until curl -sf http://localhost:8080/ > /dev/null 2>&1; do sleep 1; done

      - name: Run functional tests
        working-directory: /tmp/drupal
        env:
          SIMPLETEST_DB: 'sqlite://localhost//tmp/drupal/sites/default/files/test.sqlite'
          SIMPLETEST_BASE_URL: 'http://localhost:8080'
          BROWSERTEST_OUTPUT_DIRECTORY: '/tmp/browsertest_output'
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          mkdir -p /tmp/browsertest_output
          ./vendor/bin/phpunit \
            modules/contrib/scolta/tests/src/Functional/ \
            --bootstrap core/tests/bootstrap.php \
            --display-deprecations \
            --testdox

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [
              ["type" => "composer", "url" => "https://packages.drupal.org/8"],
              ["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"],
            ];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            // Provide drupal/core so drupal/search_api dependency resolves without
            // pulling in the full Drupal framework into the unit test environment.
            $j["provide"]["drupal/core"] = "11.2.0";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      # css/scolta.css is committed, so the layout specs read the copy this
      # branch would ship. Composer no longer overwrites it on install.
      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install
        working-directory: tests/playwright

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/playwright

      - name: Run Playwright layout tests
        run: npx playwright test
        working-directory: tests/playwright

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Hard failure, deliberately outside the `|| echo` below. A declared
      # "version" overrides the version Composer derives from the branch or
      # tag; the drupal.org facade honours it, so the package presented itself
      # as a fixed string whatever branch it came from and a site tracking
      # dev-1.0.x could `composer update` but never `composer install`.
      - name: composer.json must not declare a version
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            if (array_key_exists("version", $j)) {
              fwrite(STDERR, "FAIL: composer.json declares \"version\": " . $j["version"] . "\n");
              fwrite(STDERR, "Remove it. scolta.info.yml is the source of the module version;\n");
              fwrite(STDERR, "extra.branch-alias describes the dev-main mapping.\n");
              exit(1);
            }
            echo "PASS: composer.json declares no version key.\n";
          '

      # Release readiness. Advisory on a development branch, where the version
      # legitimately ends in -dev; the assertion that must never be waved
      # through is the separate step above.
      - name: Check version locations match
        run: |
          php scripts/validate-release.php || echo "Note: -dev versions expected in development"

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check version alignment with scolta-php
        run: |
          # scolta.info.yml, not composer.json: this module declares no
          # "version" in composer.json (Composer derives it from the branch or
          # tag), and info.yml is what drupal.org packaging writes and what
          # Drupal reads.
          MY_VERSION=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+).*/\1/p" scolta.info.yml | head -1)
          if [ -z "$MY_VERSION" ]; then
            echo "FAIL: no version key found in scolta.info.yml"
            exit 1
          fi
          MY_MAJOR=$(echo "$MY_VERSION" | cut -d. -f1)
          PHP_CONSTRAINT=$(php -r "echo json_decode(file_get_contents('composer.json'))->require->{'tag1/scolta-php'};")

          echo "My version: $MY_VERSION (major: $MY_MAJOR)"
          echo "scolta-php constraint: $PHP_CONSTRAINT"

          if [ "$PHP_CONSTRAINT" = "@dev" ]; then
            echo "SKIP: Development mode (@dev constraint)"
            exit 0
          fi

          PHP_MAJOR=$(echo "$PHP_CONSTRAINT" | sed 's/[\^~>=<]//g' | cut -d. -f1)
          if [ "$MY_MAJOR" != "$PHP_MAJOR" ]; then
            echo "FAIL: Major version mismatch"
            exit 1
          fi
          echo "PASS: Major versions aligned"

  lock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scolta-php is stable and from Packagist
        run: |
          python3 - <<'PY'
          import json,sys,re
          lock=json.load(open("composer.lock"))
          pkgs=lock.get("packages",[])+lock.get("packages-dev",[])
          p=next((x for x in pkgs if x["name"]=="tag1/scolta-php"),None)
          if not p: sys.exit("scolta-php not in lock")
          dist=(p.get("dist") or {}).get("type")
          ver=p.get("version","")
          bad=[]
          if dist=="path": bad.append(f"dist.type=path ({(p.get('dist') or {}).get('url')})")
          if not re.fullmatch(r"\d+\.\d+\.\d+", ver): bad.append(f"non-stable version {ver}")
          if bad: sys.exit("LOCK GUARD FAILED for tag1/scolta-php: "+"; ".join(bad))
          print(f"Lock guard OK: tag1/scolta-php {ver} via {dist}")
          PY

  dist-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate drupal.org distribution tarball
        run: scripts/validate-dist-archive.sh

  antipatterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for known bad patterns
        run: |
          FAIL=0

          # IndexBuildOrchestrator::build() must be called with a logger argument.
          # (Logger/progress go to build()/finalize(), not the constructor.)
          if grep -rn 'orchestrator->build(' src/ 2>/dev/null | grep -qvE 'logger|Logger'; then
            echo "FAIL: orchestrator->build() called without a logger argument"
            grep -rn 'orchestrator->build(' src/ | grep -vE 'logger|Logger'
            FAIL=1
          fi

          [ $FAIL -eq 0 ] && echo "PASS: No known bad patterns found."
          exit $FAIL
