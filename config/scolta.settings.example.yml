# Scolta index configuration (scolta.settings)
# These are the default values installed with the scolta module.
# Override via the admin UI at /admin/config/search/scolta/index
# or by importing config overrides.
#
# Query-time settings — scoring, display, the AI tier — are
# scolta_ui.settings, owned by the scolta_ui module. See
# modules/scolta_ui/config/scolta_ui.settings.example.yml.

# --- Indexer ---
indexer: 'auto'                     # 'auto', 'php' or 'binary'
memory_budget:
  profile: 'conservative'           # 'conservative', 'balanced', 'aggressive', or a byte value like '256M'
  custom_bytes: ~                   # Explicit byte budget (null uses the named profile)
  chunk_size: ~                     # Pages per chunk (null uses the profile default)

# --- Index dimensions ---
# The names are baked into the index at build time, so changing them means a
# rebuild. Their human descriptions are query-time and live in scolta_ui.
sortable_fields: []                 # Sort dimensions: ['date', 'title']
filter_fields: []                   # Filter dimensions: ['type', 'section']
field_mappings:
  sortable: {}                      # Entity field to sort dimension: { field_date: date }
  filters: {}                       # Entity field to filter dimension: { field_section: section }

# --- Incremental updates ---
incremental:
  enabled: true                     # Apply small change sets without a full rebuild
  max_changed_items: 100            # Largest change set applied incrementally

# --- Pagefind ---
pagefind:
  build_dir: 'private://scolta-build'     # Where exported HTML is stored
  output_dir: 'public://scolta-pagefind'  # Where Pagefind index is built
  binary: 'pagefind'                       # Binary path (leave default for auto-detection)
  auto_rebuild: true                       # Rebuild index on Search API indexing
  view_mode: 'search_index'               # Entity view mode for rendering
