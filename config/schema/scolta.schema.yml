# Build-time settings only. Everything query-time — scoring, display, the AI
# tier, the field descriptions — is scolta_ui.settings, owned by scolta_ui.
scolta.settings:
  type: config_object
  label: 'Scolta index settings'
  mapping:
    sortable_fields:
      type: sequence
      label: 'Sortable fields'
      sequence:
        type: string
        label: 'Field name'
    filter_fields:
      type: sequence
      label: 'Filter fields'
      sequence:
        type: string
        label: 'Filter dimension name'
    entity_types:
      type: sequence
      label: 'Entity types to index, keyed by entity type ID'
      sequence:
        type: sequence
        label: 'Bundles to index; empty for all bundles of the type'
        sequence:
          type: string
          label: 'Bundle'
    body_fields:
      type: sequence
      label: 'Body content fields'
      sequence:
        type: string
        label: 'Entity field name holding body content'
    field_mappings:
      type: mapping
      label: 'Automatic field-to-dimension mappings'
      mapping:
        sortable:
          type: sequence
          label: 'Sortable field mappings'
          sequence:
            type: string
            label: 'Dimension name for this entity field'
        filters:
          type: sequence
          label: 'Filter field mappings'
          sequence:
            type: string
            label: 'Dimension name for this entity field'
    memory_budget:
      type: mapping
      label: 'Memory budget configuration'
      mapping:
        profile:
          type: string
          label: 'Memory budget profile (conservative, balanced, aggressive, or byte value like 256M)'
        custom_bytes:
          type: integer
          label: 'Custom byte budget (null for named profile)'
        chunk_size:
          type: integer
          label: 'Pages per chunk (null uses profile default)'
    pagefind:
      type: mapping
      label: 'Pagefind configuration'
      mapping:
        build_dir:
          type: string
          label: 'Build directory'
        output_dir:
          type: string
          label: 'Output directory'
        auto_rebuild:
          type: boolean
          label: 'Rebuild the index when indexed content changes'
        auto_rebuild_delay:
          type: integer
          label: 'Seconds to wait after the last content change before rebuilding (60-3600)'
    incremental:
      type: mapping
      label: 'Incremental index update configuration'
      mapping:
        enabled:
          type: boolean
          label: 'Update the index incrementally for small change sets'
        max_changed_items:
          type: integer
          label: 'Largest change set applied incrementally before falling back to a full rebuild'
    cleanup:
      type: mapping
      label: 'Retired index cleanup configuration'
      mapping:
        cron_seconds:
          type: integer
          label: 'Wall-clock seconds each cron run may spend deleting retired index directories (0 disables cron cleanup)'

