# Build-time settings only: what goes into the index and how it is built.
#
# The query-time half — scoring, display, the AI tier and the field
# descriptions — is scolta_ui.settings, owned by the scolta_ui module.
sortable_fields: []
filter_fields: []
field_mappings:
  sortable: {}
  filters: {}
indexer: 'auto'
memory_budget:
  profile: 'conservative'
  custom_bytes: ~
  chunk_size: ~
pagefind:
  build_dir: 'public://scolta-build'
  output_dir: 'public://scolta-pagefind'
  binary: 'pagefind'
  auto_rebuild: true
  view_mode: 'search_index'
incremental:
  enabled: true
  max_changed_items: 100
