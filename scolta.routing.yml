scolta.settings.amazee:
  path: '/admin/config/search/scolta/amazee'
  defaults:
    _form: '\Drupal\scolta\Form\AmazeeSettingsForm'
    _title: 'Amazee.ai Configuration'
  requirements:
    _permission: 'administer scolta'

scolta.dismiss_rebuild_notice:
  path: '/admin/config/search/scolta/dismiss-rebuild-notice'
  defaults:
    _controller: '\Drupal\scolta\Controller\DismissRebuildNoticeController::handle'
    _title: 'Dismiss rebuild notice'
  requirements:
    _permission: 'administer scolta'
    _csrf_token: 'TRUE'
  methods: [GET]

scolta.settings:
  path: '/admin/config/search/scolta'
  defaults:
    _form: '\Drupal\scolta\Form\ScoltaSettingsForm'
    _title: 'Scolta Settings'
  requirements:
    _permission: 'administer scolta'

# The permission is the role-level rule and is left as the plain requirement
# it has always been. `_scolta_ai` adds the per-feature rule the block is
# built from — the config flags, plus anything a site has decorated onto
# scolta.ai_access — so the endpoint refuses whatever the markup withheld.
scolta.expand:
  path: '/api/scolta/v1/expand-query'
  defaults:
    _controller: '\Drupal\scolta\Controller\ExpandQueryController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'expand'

scolta.summarize:
  path: '/api/scolta/v1/summarize'
  defaults:
    _controller: '\Drupal\scolta\Controller\SummarizeController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'summarize'

scolta.followup:
  path: '/api/scolta/v1/followup'
  defaults:
    _controller: '\Drupal\scolta\Controller\FollowUpController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'follow_up'

# The chat. Same permission and feature check as the AI endpoints above.
# _csrf_request_header_token covers requests that carry a session (signed in
# users); an anonymous visitor has none, and every chat handler also requires
# the X-Scolta-Chat header, which a cross site form cannot send. no_cache keeps
# the responses out of the page caches.
scolta.chat_plan:
  path: '/api/scolta/v1/chat/plan'
  defaults:
    _controller: '\Drupal\scolta\Controller\ChatPlanController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'chat'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

scolta.chat_turn:
  path: '/api/scolta/v1/chat/turn'
  defaults:
    _controller: '\Drupal\scolta\Controller\ChatTurnController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'chat'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

scolta.chat_fold:
  path: '/api/scolta/v1/chat/fold'
  defaults:
    _controller: '\Drupal\scolta\Controller\ChatFoldController::handle'
  methods: [POST]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'chat'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

scolta.chat_thread:
  path: '/api/scolta/v1/chat/thread'
  defaults:
    _controller: '\Drupal\scolta\Controller\ChatThreadController::handle'
  methods: [GET, DELETE]
  requirements:
    _permission: 'use scolta ai'
    _scolta_ai: 'chat'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

# Reachable anonymously so uptime monitors always work; the controller
# returns status-only unless the caller has 'administer scolta'.
scolta.health:
  path: '/api/scolta/v1/health'
  defaults:
    _controller: '\Drupal\scolta\Controller\HealthController::handle'
  methods: [GET]
  requirements:
    _access: 'TRUE'
