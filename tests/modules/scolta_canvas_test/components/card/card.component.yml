$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
status: stable
props:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      title: Title
      examples:
        - A card
    body:
      type: string
      title: Body
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Card text</p>'
    image_url:
      type: string
      title: Image
      format: uri-reference
      examples:
        - /results.jpg
    link_label:
      type: string
      title: Link label
      examples:
        - Read more
    link_url:
      type: string
      title: Link URL
      format: uri-reference
      examples:
        - /results
    style:
      type: string
      title: Style
      enum:
        - card--plain
        - card--highlight
      examples:
        - card--plain
