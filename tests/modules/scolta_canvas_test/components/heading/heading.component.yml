$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Heading
status: stable
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Text
      examples:
        - A heading
    level:
      type: integer
      title: Level
      enum:
        - 2
        - 3
      examples:
        - 2
    anchor:
      type: string
      title: Anchor ID
      examples:
        - 0b4a7c1e-2f3d-4e5f-8a9b-0c1d2e3f4a5b
